<li
  class="custom-note-item"
  [class.indented]="indented"
  [class.active-note]="isSelected"
  (click)="select.emit(note.id)"
  (contextmenu)="contextMenu.emit($event)"
>
  <div class="note-item-content">
    @if (isEditing) {
      <input
        type="text"
        class="edit-title-input"
        [ngModel]="editText"
        (ngModelChange)="changeText.emit($event)"
        (blur)="save.emit({ note })"
        (keydown.enter)="save.emit({ note, event: $event })"
        (click)="$event.stopPropagation()"
      />
    } @else {
      <div class="note-title" [title]="note.title">
        <span class="note-title-label">{{ note.title || 'Untitled Note' }}</span>
        @if (note.pinned) {
          <span nz-icon nzType="pushpin" class="pinned-indicator" nz-tooltip nzTooltipTitle="Pinned"></span>
        }
      </div>
    }

    <div class="note-meta-sidebar">
      <span class="note-time">{{ formattedTime }}</span>
      <span class="note-snippet">{{ snippet }}</span>
    </div>
  </div>

  <div class="note-actions">
    <button nz-button nzType="text" nzSize="small" (click)="edit.emit({ event: $event, note })">
      <span nz-icon nzType="edit"></span>
    </button>
    <button nz-button nzType="text" nzDanger nzSize="small" (click)="delete.emit({ id: note.id, event: $event })">
      <span nz-icon nzType="delete"></span>
    </button>
  </div>
</li>
